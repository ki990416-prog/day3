<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 갤러리</title>
</head>
<body>
    <header class="top">
        <a class="logo" href="/">🌴 제주 갤러리</a>
        <nav id="nav"></nav>
    </header>

    <section class="hero">
        <h1>제주의 바다와 오름을 사진으로</h1>
        <p>로그인하면 마음에 드는 사진을 내 보관함에 담을 수 있어요.</p>
    </section>

    <main>
        <div class="tabs" id="tabs"></div>
        <div id="status" class="status"></div>
        <div class="grid" id="grid"></div>
    </main>

    <footer>사진 제공: <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a></footer>

    <!-- 로그인/회원가입 창 -->
    <dialog id="authDialog">
        <form id="authForm" method="dialog">
            <h2 id="authTitle">로그인</h2>
            <input id="email" type="email" placeholder="이메일" required autocomplete="email">
            <input id="password" type="password" placeholder="비밀번호 (6자 이상)" required minlength="6" autocomplete="current-password">
            <div id="authMsg" class="msg"></div>
            <button type="submit" id="authSubmit" class="primary">로그인</button>
            <button type="button" id="authSwitch" class="link">계정이 없으신가요? 회원가입</button>
            <button type="button" id="authClose" class="link">닫기</button>
        </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
