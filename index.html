<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 지진 지도</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; }
        #bar { padding: 8px; display: flex; gap: 8px; align-items: center; background: #1b1f2a; color: #fff; }
        #bar b { font-size: 18px; }
        select { padding: 6px; font-size: 16px; }
        #info { font-size: 13px; color: #cfd6e6; margin-left: auto; text-align: right; }
        #map { height: calc(100vh - 52px); }
        .legend { background: #fff; padding: 8px 10px; border-radius: 6px; font-size: 12px; line-height: 1.6; }
        .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    </style>
</head>
<body>
    <div id="bar">
        <b>🌍 실시간 지진 지도</b>
        <select id="feed">
            <option value="all_hour">지난 1시간</option>
            <option value="all_day" selected>지난 24시간</option>
            <option value="2.5_week">지난 7일 (규모 2.5 이상)</option>
            <option value="4.5_week">지난 7일 (규모 4.5 이상)</option>
        </select>
        <div id="info">불러오는 중...</div>
    </div>
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        // Leaflet + OpenStreetMap
        const map = L.map("map", { worldCopyJump: true }).setView([20, 140], 3)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors | 지진 데이터: USGS", maxZoom: 18
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        // 규모별 색과 크기
        const color = (m) => m >= 6 ? "#7f0000" : m >= 5 ? "#e53935" : m >= 4 ? "#fb8c00" : m >= 3 ? "#fdd835" : "#43a047"
        const radius = (m) => Math.max(3, m * m * 0.9 + 2)

        // 범례
        const legend = L.control({ position: "bottomright" })
        legend.onAdd = () => {
            const div = L.DomUtil.create("div", "legend")
            div.innerHTML = [["#7f0000", "규모 6 이상"], ["#e53935", "5 ~ 6"], ["#fb8c00", "4 ~ 5"], ["#fdd835", "3 ~ 4"], ["#43a047", "3 미만"]]
                .map(([c, t]) => `<i style="background:${c}"></i>${t}`).join("<br>")
            return div
        }
        legend.addTo(map)

        const load = async () => {
            const info = document.getElementById("info")
            const feed = document.getElementById("feed").value
            try {
                const res = await fetch(`https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/${feed}.geojson`)
                const data = await res.json()
                layer.clearLayers()
                let max = null
                for (const f of data.features) {
                    const m = f.properties.mag
                    if (m == null) continue
                    if (!max || m > max.properties.mag) max = f
                    const [lng, lat, depth] = f.geometry.coordinates
                    L.circleMarker([lat, lng], {
                        radius: radius(m), color: color(m), fillColor: color(m), fillOpacity: 0.6, weight: 1
                    }).addTo(layer).bindPopup(
                        `<b>규모 ${m}</b><br>${f.properties.place}<br>` +
                        `${new Date(f.properties.time).toLocaleString("ko-KR")}<br>` +
                        `깊이 ${depth}km<br><a href="${f.properties.url}" target="_blank">상세 보기</a>`
                    )
                }
                info.textContent = `${data.features.length}건` +
                    (max ? ` · 최대 규모 ${max.properties.mag} (${max.properties.place})` : "")
            } catch (e) {
                info.textContent = "데이터를 불러오지 못했습니다."
            }
        }

        document.getElementById("feed").onchange = load
        load()
        setInterval(load, 60000) // 1분마다 새로고침
    </script>
</body>
</html>
